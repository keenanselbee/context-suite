<div id="cs-convert-icons" aria-label="Context Suite Convert icon design review">
  <div class="viz-carousel viz-dotted-background" aria-label="Convert icon treatments">
    <section data-variant="Distinct silhouettes" aria-label="Distinct silhouettes">
      <div class="cs-review" data-treatment="distinct"></div>
    </section>
    <section data-variant="File silhouettes" aria-label="File silhouettes" hidden>
      <div class="cs-review" data-treatment="file"></div>
    </section>
  </div>
</div>
<style>
  #cs-convert-icons { color-scheme: light dark; }
  #cs-convert-icons .cs-review {
    --cs-ink: light-dark(#242424, #f5f5f5);
    --cs-muted: light-dark(#626262, #bdbdbd);
    --cs-paper: light-dark(#fafafa, #292929);
    --cs-line: light-dark(#dedede, #444444);
    --cs-hover: light-dark(#e9e9e9, #3e3e3e);
    --cs-board: light-dark(#f1f2f4, #202124);
    --cs-icon: 20px;
    font: 14px/1.4 "Segoe UI", sans-serif;
    color: var(--cs-ink);
    background: var(--cs-board);
    border-radius: 10px;
    padding: 24px 16px;
  }
  #cs-convert-icons .cs-kicker { font-size: 12px; color: var(--cs-muted); letter-spacing: .06em; text-transform: uppercase; }
  #cs-convert-icons .cs-caption { margin: 4px 0 20px; font-size: 18px; font-weight: 500; }
  #cs-convert-icons .cs-scene { min-height: 574px; }
  #cs-convert-icons .cs-selection { color: var(--cs-muted); font-size: 12px; margin: 0 auto 14px; max-width: 440px; }
  #cs-convert-icons .cs-menus { display: flex; align-items: flex-start; gap: 6px; justify-content: center; }
  #cs-convert-icons .cs-menu { background: var(--cs-paper); border: 1px solid var(--cs-line); border-radius: 8px; padding: 5px; box-shadow: 0 6px 18px #00000020; }
  #cs-convert-icons .cs-roots { width: 154px; flex-shrink: 0; }
  #cs-convert-icons .cs-targets { width: 232px; margin-top: 32px; }
  #cs-convert-icons .cs-row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 32px; box-sizing: border-box; border: 0; border-radius: 4px; padding: 5px 9px; background: transparent; color: inherit; font: inherit; text-align: left; }
  #cs-convert-icons button.cs-row:hover, #cs-convert-icons .cs-row[aria-pressed="true"], #cs-convert-icons .cs-root-active { background: var(--cs-hover); }
  #cs-convert-icons .cs-slot { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex: 0 0 24px; }
  #cs-convert-icons .cs-slot svg { width: var(--cs-icon); height: var(--cs-icon); display: block; }
  #cs-convert-icons .cs-arrow { margin-left: auto; font-size: 18px; }
  #cs-convert-icons .cs-rule { height: 1px; background: var(--cs-line); margin: 5px 7px; }
  #cs-convert-icons .cs-sheet { background: var(--cs-paper); padding: 20px; border-radius: 10px; margin-top: 18px; }
  #cs-convert-icons .cs-sheet-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; margin-bottom: 16px; font-weight: 500; }
  #cs-convert-icons .cs-sheet-head small { font-size: 12px; color: var(--cs-muted); font-weight: 400; }
  #cs-convert-icons .cs-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px 10px; }
  #cs-convert-icons .cs-cell { text-align: center; min-width: 0; }
  #cs-convert-icons .cs-large { width: 32px; height: 32px; margin: 0 auto 8px; }
  #cs-convert-icons .cs-large svg { width: 32px; height: 32px; }
  #cs-convert-icons .cs-label { font-size: 12px; min-height: 34px; }
  #cs-convert-icons .cs-sizes { display: flex; align-items: center; justify-content: center; gap: 10px; height: 26px; color: var(--cs-ink); }
  #cs-convert-icons .cs-sizes svg { display: block; flex-shrink: 0; }
  #cs-convert-icons .cs-note { font-size: 12px; color: var(--cs-muted); margin-top: 16px; min-height: 18px; }
  @media (max-width: 460px) {
    #cs-convert-icons .cs-review { padding: 20px 8px; }
    #cs-convert-icons .cs-menus { flex-direction: column; align-items: center; }
    #cs-convert-icons .cs-roots { width: 232px; }
    #cs-convert-icons .cs-roots .cs-row:not(.cs-root-active) { display: none; }
    #cs-convert-icons .cs-targets { margin-top: 0; }
    #cs-convert-icons .cs-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    #cs-convert-icons .cs-sheet { padding: 14px 8px; }
    #cs-convert-icons .cs-scene { min-height: 598px; }
  }
  @media (pointer: coarse) { #cs-convert-icons button.cs-row { min-height: 44px; } #cs-convert-icons .cs-scene { min-height: 770px; } }
</style>
<script>
(() => {
  const root = document.getElementById('cs-convert-icons');
  // Original concept geometry; the root arrows retain the current Compact source.
  const shapes = {
    png: '<path fill-rule="evenodd" d="M2 3h20v18H2zm3 3v12h14V6z"/><path d="M5 6h7v6H5zM12 12h7v6h-7z"/>',
    jpeg: '<path fill-rule="evenodd" d="M2 4h20v16H2zM5 7v10h14V7z"/><circle cx="8" cy="9" r="1.8"/><path d="m5 17 6-7 4 4 2-2 2 5z"/>',
    webp: '<path fill-rule="evenodd" d="M6 2h12a4 4 0 0 1 4 4v12a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V6a4 4 0 0 1 4-4Zm2 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM5 18h14l-3-7-3 4-3-4z"/>',
    bmp: '<path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h3v3h-3zM18 13h3v3h-3zM13 18h3v3h-3zM18 18h3v3h-3z"/>',
    tga: '<path d="M3 3h14v3H6v10H3z"/><path fill-rule="evenodd" d="M8 8h13v13H8zm2 10h9l-5-7z"/>',
    dds: '<path d="m12 2 10 5-10 5L2 7zm-10 8 8.5 4.2V23L2 18zm20 0v8l-8.5 5v-8.8z"/>',
    wav: '<path d="M2 10h3v4H2zM6 5h3v14H6zM10 2h4v20h-4zM15 7h3v10h-3zM19 10h3v4h-3z"/>',
    flac: '<path d="M2 3h5v3H5v12h2v3H2zM22 3h-5v3h2v12h-2v3h5zM7 9h2.5v6H7zM10.75 6h2.5v12h-2.5zM14.5 9H17v6h-2.5z"/>',
    mp3: '<path d="M9 4 22 2v15h-3V7l-7 1v11H9z"/><ellipse cx="7" cy="19" rx="5" ry="3"/><ellipse cx="17" cy="17" rx="5" ry="3"/>',
    m4a: '<path fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm-1 4h6v3h-3v6a4 3 0 1 1-3-2.9Z"/>',
    ogg: '<path d="M2 12a10 10 0 0 1 20 0v8h-4v-8a6 6 0 0 0-12 0v8H2zM2 13h6v9H2zM16 13h6v9h-6z"/>',
    opus: '<path d="M2 9h4l5-5v16l-5-5H2zM14 7h3v10h-3zM19 3h3v18h-3z"/>',
    pdf: '<path fill-rule="evenodd" d="M4 2h10l6 6v14H4zm10 2v5h5zM7 11v5h5v-5zm7 0v2h3v-2zm0 4v2h3v-2zm-7 4v1h10v-1z"/>',
    docx: '<path fill-rule="evenodd" d="M3 2h12l6 6v14H3zm12 1v6h5zM5 10l2.6 10h3l1.4-4.5 1.4 4.5h3L19 10h-2.8L15 16l-1.5-4h-3L9 16l-1.2-6z"/>',
    settings: '<path d="M2 5h20v2H2zM2 11h20v2H2zM2 17h20v2H2zM6 2h4v8H6zM15 8h4v8h-4zM6 14h4v8H6z"/>',
    convert: '<path d="M3 5.5h12v-3L22 8l-7 5.5v-3H3zm18 8H9v-3L2 16l7 5.5v-3h12z"/>',
    optimize: '<g transform="translate(1.2 1.2) scale(.9)"><path d="m2.5 4 8 8-8 8-2-3 5-5-5-5zm19 0-8 8 8 8 2-3-5-5 5-5z"/></g>',
    analyze: '<path fill-rule="evenodd" d="M3 2h9l5 5v3a7 7 0 0 0-7 11H3zm3 8v6h2v-6zm3-3v9h2V7z"/><path fill-rule="evenodd" d="M16 11a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0 2.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/><path d="m18 19.5 1.5-1.5 3.5 3.5-1.5 1.5z"/>'
  };
  const formats = [
    ['png','PNG'],['jpeg','JPEG'],['webp','WebP (lossless)'],['bmp','BMP'],
    ['tga','TGA'],['dds','DDS...'],['wav','WAV'],['flac','FLAC'],['mp3','MP3'],
    ['m4a','M4A (AAC)'],['ogg','Ogg Vorbis'],['opus','Opus'],['pdf','PDF'],['docx','Word (DOCX)']
  ];
  const scenarios = {
    'Mixed files': { files:'photo.jpg + image.png + song.wav + report.pdf', ids:formats.map(f => f[0]) },
    'JPEG image': { files:'photo.jpg', ids:['png','webp','bmp','tga','dds','pdf'] },
    'PNG image': { files:'image.png', ids:['jpeg','webp','bmp','tga','dds','pdf'] },
    'WAV audio': { files:'song.wav', ids:['flac','mp3','m4a','ogg','opus'] },
    'PDF document': { files:'report.pdf', ids:['png','docx'] },
    'Office document': { files:'report.docx', ids:['pdf'] },
    'HEIC image': { files:'photo.heic', ids:['png','jpeg'] }
  };
  const state = { appearance:'System', size:'20', selection:'Mixed files' };
  let serial = 0;
  function svg(name, treatment = 'distinct', size) {
    const shape = shapes[name];
    let content = shape;
    if (treatment === 'file' && formats.some(f => f[0] === name)) {
      const id = 'cs-file-mask-' + (++serial);
      content = '<defs><mask id="'+id+'"><path fill="white" d="M4 2h10l6 6v14H4z"/><path fill="black" d="M14 3v6h5z"/><g fill="black" transform="translate(5.5 10) scale(.54)">'+shape.replaceAll('fill="var(--cs-paper)"','fill="white"')+'</g></mask></defs><path d="M0 0h24v24H0z" mask="url(#'+id+')"/>';
    }
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"'+(size?' width="'+size+'" height="'+size+'"':'')+'>'+content+'</svg>';
  }
  function row(name,label,treatment,active=false,rootRow=false) {
    return '<'+(rootRow?'div':'button type="button"')+' class="cs-row cursor-interaction'+(active&&rootRow?' cs-root-active':'')+'"'+(!rootRow?' aria-pressed="false" data-name="'+name+'"':'')+'><span class="cs-slot">'+svg(name,treatment)+'</span><span>'+label+'</span>'+(rootRow&&name!=='analyze'?'<span class="cs-arrow">›</span>':'')+'</'+(rootRow?'div':'button')+'>';
  }
  const selected = new Map();
  function render() {
    const scene = scenarios[state.selection];
    root.querySelectorAll('.cs-review').forEach(panel => {
      const treatment = panel.dataset.treatment;
      panel.style.colorScheme = state.appearance === 'System' ? 'light dark' : state.appearance.toLowerCase();
      panel.style.setProperty('--cs-icon', state.size+'px');
      panel.innerHTML = '<div class="cs-kicker">Context Suite · Convert</div><div class="cs-caption">'+(treatment==='distinct'?'Distinct silhouettes':'File silhouettes')+'</div><div class="cs-scene"><div class="cs-selection">'+scene.files+'</div><div class="cs-menus"><div class="cs-menu cs-roots" aria-label="Context Suite commands">'+row('analyze','Analyze','distinct',false,true)+row('convert','Convert','distinct',true,true)+row('optimize','Optimize','distinct',false,true)+'</div><div class="cs-menu cs-targets" aria-label="Convert targets">'+formats.filter(f=>scene.ids.includes(f[0])).map(f=>row(f[0],f[1],treatment)).join('')+'<div class="cs-rule"></div>'+row('settings','Settings...','distinct')+'</div></div></div><div class="cs-sheet"><div class="cs-sheet-head"><span>Complete output family</span><small>Detail · 16 / 20 / 24 px</small></div><div class="cs-grid">'+formats.map(f=>'<div class="cs-cell"><div class="cs-large">'+svg(f[0],treatment)+'</div><div class="cs-label">'+f[1]+'</div><div class="cs-sizes">'+[16,20,24].map(n=>svg(f[0],treatment,n)).join('')+'</div></div>').join('')+'</div></div><div class="cs-note" aria-live="polite">Design preview · '+state.size+' px menu icons</div>';
      panel.querySelectorAll('button.cs-row').forEach(button => {
        button.setAttribute('aria-pressed', String(selected.get(treatment)===button.dataset.name));
        button.addEventListener('click', () => {
          selected.set(treatment,button.dataset.name);
          panel.querySelectorAll('button.cs-row').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));
          panel.querySelector('.cs-note').textContent = 'Selected for review: '+button.textContent+' · preview only';
        });
      });
    });
  }
  render();
  if (globalThis.Tweak) {
    const tweak = new Tweak({container:root,onChange:render});
    tweak.addSelect(state,'appearance',{label:'Appearance',options:['System','Light','Dark']});
    tweak.addSelect(state,'size',{label:'Menu icon size (px)',options:['16','20','24']});
    tweak.addSelect(state,'selection',{label:'Selected files',options:Object.keys(scenarios)});
  }
})();
</script>
