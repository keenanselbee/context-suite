name: Public contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Public source boundaries and documentation
        shell: pwsh
        run: ./tools/Test-Repository.ps1
      - name: Public foundation contracts
        shell: pwsh
        run: ./tools/Test-Foundation.ps1 -Configuration Release
      - name: Missing private implementation errors
        shell: pwsh
        run: ./tools/Test-PrivateBoundary.ps1
      - name: Native shell contracts
        shell: pwsh
        run: ./tools/Test-ShellPrototype.ps1 -Configuration Release
