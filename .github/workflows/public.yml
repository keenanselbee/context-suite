name: Public contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Public source boundaries and documentation
        shell: pwsh
        run: ./tools/Test-Repository.ps1
      - name: Installer recovery contracts (mocked platform, no installation)
        shell: powershell
        run: |
          ./tools/release/Test-InnoInstaller.ps1
          ./tools/release/Test-InstallerLifecycle.ps1
      - name: Public foundation contracts
        shell: pwsh
        run: ./tools/Test-Foundation.ps1 -Configuration Release
      - name: Compile desktop smoke harness (no interactive run)
        shell: pwsh
        run: dotnet build tests/ContextSuite.Desktop.SmokeTests/ContextSuite.Desktop.SmokeTests.csproj -c Release
      - name: Compile isolated real-UI test host (no interactive run)
        shell: pwsh
        run: dotnet build tests/ContextSuite.Application.TestHost/ContextSuite.Application.TestHost.csproj -c Release
      - name: Missing private implementation errors
        shell: pwsh
        run: ./tools/Test-PrivateBoundary.ps1
      - name: Native shell contracts
        shell: pwsh
        run: ./tools/Test-ShellPrototype.ps1 -Configuration Release
